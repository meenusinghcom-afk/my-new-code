<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; text-align: center; padding: 40px 20px; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 350px; width: 100%; }
        h2 { color: #007bff; margin-bottom: 20px; }
        input[type="date"] { width: 90%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 95%; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 25px; font-size: 18px; font-weight: bold; color: #28a745; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>Age Calculator 📅</h2>
    <p>Enter your Date of Birth:</p>
    <input type="date" id="dob">
    <button onclick="calculateAge()">Calculate Age</button>
    <div id="result"></div>
</div>

<script>
function calculateAge() {
    var dobInput = document.getElementById("dob").value;
    if(!dobInput) {
        document.getElementById("result").innerHTML = "Please select a date!";
        return;
    }
    var dob = new Date(dobInput);
    var today = new Date();
    
    var ageYears = today.getFullYear() - dob.getFullYear();
    var ageMonths = today.getMonth() - dob.getMonth();
    var ageDays = today.getDate() - dob.getDate();
    
    if (ageDays < 0) {
        ageMonths--;
        ageDays += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }
    if (ageMonths < 0) {
        ageYears--;
        ageMonths += 12;
    }
    
    document.getElementById("result").innerHTML = "You are <br>" + ageYears + " Years, " + ageMonths + " Months, and " + ageDays + " Days old!";
}
</script>

</body>
</html>
